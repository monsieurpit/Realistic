  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.google.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://yt3.ggpht.com">
  <link rel="dns-prefetch" href="https://play.google.com">

<body>
  <!-- Liquid Glass refraction filter (used by Chromium browsers) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg-refract" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- Boot screen -->
  <div id="boot" class="screen">
    <div class="boot-logo"><span>P</span></div>
    <div class="boot-bar"><div class="boot-fill"></div></div>
  </div>

  <!-- Lock / login screen -->
  <div id="lock" class="screen hidden">
    <div class="lock-bg"></div>
    <div class="lock-clock">
      <div class="lock-date"></div>
      <div class="lock-time"></div>
    </div>
    <div class="lock-user">
      <div class="lock-avatar"></div>
      <div class="lock-name"></div>
      <form class="lock-form" autocomplete="off">
        <input type="password" class="lock-pass" placeholder="Enter Password">
        <button type="submit" class="lock-go" aria-label="Log in">&#10140;</button>
      </form>
      <div class="lock-hint"></div>
    </div>
    <div class="lock-actions">
      <button data-act="sleep"><span>&#9790;</span>Sleep</button>
      <button data-act="restart"><span>&#8635;</span>Restart</button>
      <button data-act="shutdown"><span>&#9211;</span>Shut Down</button>
    </div>
  </div>

  <!-- Off screen -->
  <div id="off" class="screen hidden"><div class="off-msg">PatOS is shut down.<br><small>Click anywhere to start up.</small></div></div>

  <!-- Desktop -->
  <div id="desktop" class="hidden">
    <canvas id="wallpaper"></canvas>
    <canvas id="wallpaper3d"></canvas>
    <div id="desktop-icons"></div>
    <div id="windows"></div>
    <div id="selection-box"></div>

    <header id="menubar">
      <div class="mb-left">
        <button class="mb-logo" data-menu="system" aria-label="PatOS menu">P</button>
        <button class="mb-app" data-menu="app">Finder</button>
        <button class="mb-item" data-menu="file">File</button>
        <button class="mb-item" data-menu="edit">Edit</button>
        <button class="mb-item" data-menu="view">View</button>
        <button class="mb-item" data-menu="window">Window</button>
        <button class="mb-item" data-menu="help">Help</button>
      </div>
      <div class="mb-right">
        <span class="mb-status" id="mb-battery" title="Battery"></span>
        <button class="mb-status" id="mb-wifi" title="Wi-Fi"></button>
        <button class="mb-status" id="mb-search" title="Spotlight (Ctrl+Space)"></button>
        <button class="mb-status" id="mb-cc" title="Control Center"></button>
        <button class="mb-clock" id="mb-clock"></button>
      </div>
    </header>

    <nav id="dock-wrap"><div id="dock"></div></nav>

    <div id="launchpad" class="hidden">
      <input class="lp-search" placeholder="Search" spellcheck="false">
      <div class="lp-grid"></div>
    </div>

    <div id="spotlight" class="hidden">
      <div class="sp-box">
        <div class="sp-row"><span class="sp-icon"></span><input class="sp-input" placeholder="Spotlight Search" spellcheck="false"></div>
        <div class="sp-results"></div>
      </div>
    </div>

    <div id="control-center" class="panel hidden"></div>
    <div id="notif-center" class="panel hidden"></div>
    <div id="toasts"></div>
    <div id="menu-layer"></div>
    <div id="mission" class="hidden"><div class="mc-hint">Click a window to focus it &middot; Esc to exit</div></div>
    <div id="dimmer"></div>
  </div>
